name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pnpm workspace lives in react/, not the repo root.
defaults:
  run:
    working-directory: react

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # engines pins >=20.10.0 <21
          cache: pnpm
          cache-dependency-path: react/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
